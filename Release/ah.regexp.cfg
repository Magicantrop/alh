[ALIASES]
; Rule 1: Extract from PRODUCE statements in skill descriptions
; Example: PRODUCE mithril chain armor [MCAR] -> mithril chain armor = MCAR
pattern = "PRODUCE\s+([^[]+?)\s*\[([A-Z]+)\]"
fields = alias,code
key = {alias}
value = {code}
value_set = equal

; Rule 2: Extract materials from "from" clauses in skill descriptions
; Example: from chain armor [CARM] -> chain armor = CARM
; Only match when "from" appears after a PRODUCE statement
pattern = "PRODUCE\s+[^[]*?\[[A-Z]+\]\s+from\s+(?:(\d+)\s+)?([^[]+?)\s*\[([A-Z]+)\]"
fields = quantity,alias,code
key = {alias}
value = {code}

; Rule 3: Extract items from production bonus descriptions in item descriptions
; Example: production of wood [WOOD] -> wood = WOOD
pattern = "This item increases the production of\s+([^[]+?)\s*\[([A-Z]+)\]"
fields = alias,code
key = {alias}
value = {code}
value_set = equal

; Rule 4: Extract skills that races may study
; Example: may study hunting [HUNT] -> hunting = HUNT
pattern = "may study\s+([^[]+?)\s*\[([A-Z]+)\]"
fields = alias,code
key = {alias}
value = {code}
value_set = equal

; Rule 5: Extract from BUILD statements
; Example: BUILD a Tower [TOWR] -> Tower = TOWR
;pattern = "BUILD\s+(?:a|an)?\s*([^[]+?)\s*\[([A-Z]+)\]"
;fields = alias,code
;key = {alias}
;value = {code}
;value_set = equal

; Rule 6: Extract from "requires" statements (for skills)
; Example: This skill requires force [FORC] 1 -> force = FORC
pattern = "requires\s+([^[]+?)\s*\[([A-Z]+)\](?:\s+\d+)?(?:\s+and|\.|,|$)"
fields = alias,code
key = {alias}
value = {code}
value_set = equal

; Rule 7: Extract from "and" constructions - after a code or code with number
; Matches: ] and  OR  ] 1 and
;pattern = "\](?:\s+\d+)?\s+and\s+([^[]+?)\s*\[([A-Z]+)\]"
; Rule 9: Extract from skill names in skill descriptions
; Example: armorer [ARMO] -> armorer = ARMO
pattern = "^([A-Za-z_ ]+?)\s*\[([A-Z]+)\]"
fields = alias,code
key = {alias}
value = {code}
value_set = equal

[MAX_SKILL_LEVELS]
; Rule 1: Race with 1 skill
; Example: leader [LEAD], ... This race may study force [FORC] to level 5 and all other skills to level 5.
pattern = "\[([A-Z]+)\].*?This race may study .*?\[([A-Z]+)\].*?to level (\d+) and all other skills to level (\d+)"
fields = race,skill1,main_level,other_level
key = {race}
value = {main_level},{other_level},{skill1}
value_set = equal

; Rule 2: Race with 2 skills (with "and")
; Example: race [CODE] ... may study skill1 [CODE1] and skill2 [CODE2] to level X...
pattern = "\[([A-Z]+)\].*?This race may study .*?\[([A-Z]+)\].*?and .*?\[([A-Z]+)\].*?to level (\d+) and all other skills to level (\d+)"
fields = race,skill1,skill2,main_level,other_level
key = {race}
value = {main_level},{other_level},{skill1},{skill2}
value_set = equal

; Rule 3: Race with 3 skills
; Example: may study skill1 [CODE1], skill2 [CODE2] and skill3 [CODE3] to level X...
pattern = "\[([A-Z]+)\].*?This race may study .*?\[([A-Z]+)\], .*?\[([A-Z]+)\].*?and .*?\[([A-Z]+)\].*?to level (\d+) and all other skills to level (\d+)"
fields = race,skill1,skill2,skill3,main_level,other_level
key = {race}
value = {main_level},{other_level},{skill1},{skill2},{skill3}
value_set = equal

; Rule 4: Race with 4 skills
; Example: may study skill1 [CODE1], skill2 [CODE2], skill3 [CODE3] and skill4 [CODE4] to level X...
pattern = "\[([A-Z]+)\].*?This race may study .*?\[([A-Z]+)\], .*?\[([A-Z]+)\], .*?\[([A-Z]+)\].*?and .*?\[([A-Z]+)\].*?to level (\d+) and all other skills to level (\d+)"
fields = race,skill1,skill2,skill3,skill4,main_level,other_level
key = {race}
value = {main_level},{other_level},{skill1},{skill2},{skill3},{skill4}
value_set = equal

; Rule 5: Race with 5 skills
pattern = "\[([A-Z]+)\].*?This race may study .*?\[([A-Z]+)\], .*?\[([A-Z]+)\], .*?\[([A-Z]+)\], .*?\[([A-Z]+)\].*?and .*?\[([A-Z]+)\].*?to level (\d+) and all other skills to level (\d+)"
fields = race,skill1,skill2,skill3,skill4,skill5,main_level,other_level
key = {race}
value = {main_level},{other_level},{skill1},{skill2},{skill3},{skill4},{skill5}
value_set = equal

; Rule 6: Race with 6 skills (most common)
pattern = "\[([A-Z]+)\].*?This race may study .*?\[([A-Z]+)\], .*?\[([A-Z]+)\], .*?\[([A-Z]+)\], .*?\[([A-Z]+)\], .*?\[([A-Z]+)\].*?and .*?\[([A-Z]+)\].*?to level (\d+) and all other skills to level (\d+)"
fields = race,skill1,skill2,skill3,skill4,skill5,skill6,main_level,other_level
key = {race}
value = {main_level},{other_level},{skill1},{skill2},{skill3},{skill4},{skill5},{skill6}
value_set = equal

; Rule 7: Race with 7 skills
pattern = "\[([A-Z]+)\].*?This race may study .*?\[([A-Z]+)\], .*?\[([A-Z]+)\], .*?\[([A-Z]+)\], .*?\[([A-Z]+)\], .*?\[([A-Z]+)\], .*?\[([A-Z]+)\].*?and .*?\[([A-Z]+)\].*?to level (\d+) and all other skills to level (\d+)"
fields = race,skill1,skill2,skill3,skill4,skill5,skill6,skill7,main_level,other_level
key = {race}
value = {main_level},{other_level},{skill1},{skill2},{skill3},{skill4},{skill5},{skill6},{skill7}
value_set = equal


[PRODUCTION_MONTHS]
; Rule 1: Standard production with explicit quantity and months
; Example: at a rate of 1 per 2 man-months
pattern = "PRODUCE\s+[^[]*?\[([A-Z]+)\].*?at a rate of\s+(\d+)\s+per\s+(\d+)\s+man-months?"
fields = code,quantity,months
key = {code}
value = {months}
value_set = equal

; Rule 2: Production with "1 per man-month" (implied months=1)
; Example: at a rate of 1 per man-month
pattern = "PRODUCE\s+[^[]*?\[([A-Z]+)\].*?at a rate of\s+1\s+per\s+man-month"
fields = code
key = {code}
value = 1
value_set = equal

; Rule 3: Production in list (with comma) - first items
; Example: PRODUCE swords [SWOR] from 2 iron [IRON] at a rate of 1 per 2 man-months, crossbows [XBOW] from wood [WOOD] and iron [IRON] at a rate of 1 per 2 man-months,
pattern = "PRODUCE\s+[^[]*?\[([A-Z]+)\].*?at a rate of\s+(\d+)\s+per\s+(\d+)\s+man-months?,"
fields = code,quantity,months
key = {code}
value = {months}
value_set = equal

; Rule 4: Production in list (with "and") - last item
; Example: , and battle hammers [BHAM] from iron [IRON] and wood [WOOD] at a rate of 1 per 2 man-months.
pattern = "and\s+[^[]*?\[([A-Z]+)\].*?at a rate of\s+(\d+)\s+per\s+(\d+)\s+man-months?"
fields = code,quantity,months
key = {code}
value = {months}
value_set = equal

; Rule 5: Special case for "1 per man-month" in lists
pattern = "and\s+[^[]*?\[([A-Z]+)\].*?at a rate of\s+1\s+per\s+man-month"
fields = code
key = {code}
value = 1
value_set = equal

; Rule 6: Catch-all for any "at a rate of" pattern with code
pattern = "\[([A-Z]+)\].*?at a rate of\s+(\d+)\s+per\s+(\d+)\s+man-months?"
fields = code,quantity,months
key = {code}
value = {months}
value_set = equal

[PRODUCTION_RESOURCE]
; Rule 1: One resource without quantity
pattern = "PRODUCE\s+[^[]*?\[([A-Z]+)\]\s+from\s+[^[]*?\[([A-Z]+)\]"
fields = code,res1_code
key = {code}
value = {res1_code} 1
value_set = equal

; Rule 2: One resource with quantity
pattern = "PRODUCE\s+[^[]*?\[([A-Z]+)\]\s+from\s+(\d+)\s+[^[]*?\[([A-Z]+)\]"
fields = code,qty1,res1_code
key = {code}
value = {res1_code} {qty1}
value_set = equal

; Rule 3: Two resources, both without quantity
pattern = "PRODUCE\s+[^[]*?\[([A-Z]+)\]\s+from\s+[^[]*?\[([A-Z]+)\]\s+and\s+[^[]*?\[([A-Z]+)\]"
fields = code,res1_code,res2_code
key = {code}
value = {res1_code} 1, {res2_code} 1
value_set = equal

; Rule 4: Two resources, first with quantity, second without
pattern = "PRODUCE\s+[^[]*?\[([A-Z]+)\]\s+from\s+(\d+)\s+[^[]*?\[([A-Z]+)\]\s+and\s+[^[]*?\[([A-Z]+)\]"
fields = code,qty1,res1_code,res2_code
key = {code}
value = {res1_code} {qty1}, {res2_code} 1
value_set = equal

; Rule 5: Two resources, first without quantity, second with
pattern = "PRODUCE\s+[^[]*?\[([A-Z]+)\]\s+from\s+[^[]*?\[([A-Z]+)\]\s+and\s+(\d+)\s+[^[]*?\[([A-Z]+)\]"
fields = code,res1_code,qty2,res2_code
key = {code}
value = {res1_code} 1, {res2_code} {qty2}
value_set = equal

; Rule 6: Two resources, both with quantity
pattern = "PRODUCE\s+[^[]*?\[([A-Z]+)\]\s+from\s+(\d+)\s+[^[]*?\[([A-Z]+)\]\s+and\s+(\d+)\s+[^[]*?\[([A-Z]+)\]"
fields = code,qty1,res1_code,qty2,res2_code
key = {code}
value = {res1_code} {qty1}, {res2_code} {qty2}
value_set = equal

; Rule 7: Three resources, all without quantity
pattern = "PRODUCE\s+[^[]*?\[([A-Z]+)\]\s+from\s+[^[]*?\[([A-Z]+)\],\s+[^[]*?\[([A-Z]+)\]\s+and\s+[^[]*?\[([A-Z]+)\]"
fields = code,res1_code,res2_code,res3_code
key = {code}
value = {res1_code} 1, {res2_code} 1, {res3_code} 1
value_set = equal

; Rule 8: Three resources, first with quantity
pattern = "PRODUCE\s+[^[]*?\[([A-Z]+)\]\s+from\s+(\d+)\s+[^[]*?\[([A-Z]+)\],\s+[^[]*?\[([A-Z]+)\]\s+and\s+[^[]*?\[([A-Z]+)\]"
fields = code,qty1,res1_code,res2_code,res3_code
key = {code}
value = {res1_code} {qty1}, {res2_code} 1, {res3_code} 1
value_set = equal

[PRODUCTION_SKILL]
; Rule 1: Extract from skill description header - ONLY when it's a skill header
; Example: armorer [ARMO] 3: ... PRODUCE ...
pattern = "^([A-Za-z_ ]+?)\s*\[([A-Z]+)\]\s*(\d+):.*?PRODUCE\s+[^[]*?\[([A-Z]+)\]"
fields = skill_name,skill_code,skill_level,item_code
key = {item_code}
value = {skill_code} {skill_level}
value_set = equal

; Rule 2: For skills with multiple productions - items after comma (only in skill context)
pattern = "^([A-Za-z_ ]+?)\s*\[([A-Z]+)\]\s*(\d+):.*?PRODUCE\s+[^[]*?\[([A-Z]+)\].*?,\s+[^[]*?\[([A-Z]+)\]"
fields = skill_name,skill_code,skill_level,item1_code,item2_code
key = {item2_code}
value = {skill_code} {skill_level}
value_set = equal

; Rule 3: For skills with multiple productions - items after "and" (only in skill context)
pattern = "^([A-Za-z_ ]+?)\s*\[([A-Z]+)\]\s*(\d+):.*?PRODUCE\s+[^[]*?\[([A-Z]+)\].*?and\s+[^[]*?\[([A-Z]+)\]"
fields = skill_name,skill_code,skill_level,item1_code,item2_code
key = {item2_code}
value = {skill_code} {skill_level}
value_set = equal

[PRODUCTION_TOOL]
; Rule 1: First production bonus (after "increases the production of")
pattern = "\[([A-Z]+)\].*?This is a tool.*?increases the production of\s+[^[]*?\[([A-Z]+)\]\s+by\s+(\d+)"
fields = tool_code,item_code,bonus
key = {item_code}
value = {tool_code} {bonus}
value_set = equal

; Rule 2: Production bonus after comma
pattern = "\[([A-Z]+)\].*?This is a tool.*?,\s+[^[]*?\[([A-Z]+)\]\s+by\s+(\d+)"
fields = tool_code,item_code,bonus
key = {item_code}
value = {tool_code} {bonus}
value_set = equal

; Rule 3: Production bonus after "and" (with optional comma)
pattern = "\[([A-Z]+)\].*?This is a tool.*?,\s+and\s+[^[]*?\[([A-Z]+)\]\s+by\s+(\d+)"
fields = tool_code,item_code,bonus
key = {item_code}
value = {tool_code} {bonus}
value_set = equal


[RESOURCE_SKILL]
; Извлечение навыков для добычи ресурсов
; Пример: LUMB = IRWD 3, YEW 5
pattern = "^(\w+)\s*=\s*(.+)$"
fields = skill,resources
key = {skill}
value = {resources}

[STRUCTURES]
; Извлечение атрибутов структур из описания
; Пример: Castle: This is a building. MIN_POWER 10, MAX_LOAD 800
pattern = "^(.*?):.*?(?:(?:MOBILE)|(?:MIN_POWER\s+(\d+))|(?:MAX_LOAD\s+(\d+)))*"
fields = name,min_power,max_load
key = {name}
value = {value}

[STUDYING_COST]
; Extract skill code and study cost from skill description
; Example: carpenter [CARP] 1: ... This skill costs 10 silver per month of study.
pattern = "^([A-Za-z_ ]+?)\s*\[([A-Z]+)\]\s*\d+:.*?costs\s+(\d+)\s+silver per month"
fields = skill_name,skill_code,cost
key = {skill_code}
value = {cost}
value_set = equal

[UNIT_PROPERTY_GROUPS]
; Rule 1: Armors - "This is a type of armor"
; Example: adamantium ring mail ... This is a type of armor.
pattern = ".*?\[([A-Z]+)\].*?This is a type of armor\."
fields = code
key = armours
value = {code}
value_set = inlist

; Rule 2: Bows/Ranged weapons - "This is a ranged ... weapon"
; Example: crossbow ... This is a ranged armor-piercing weapon
pattern = ".*?\[([A-Z]+)\].*?This is a ranged.*?weapon"
fields = code
key = bows
value = {code}
value_set = inlist

; Rule 3: Trade goods & junk items - "This is a trade good"
; Example: caviar ... This is a trade good.
pattern = ".*?\[([A-Z]+)\].*?This is a trade good\."
fields = code
key = trade_items
value = {code}
value_set = inlist

; Also add trade goods to junk_items
pattern = ".*?\[([A-Z]+)\].*?This is a trade good\."
fields = code
key = junk_items
value = {code}
value_set = inlist

; Rule 4: Magical items - "This item is a miscellaneous combat item" OR "used by a mage or apprentice"
; Example: book of exorcism ... This item is a miscellaneous combat item.
pattern = ".*?\[([A-Z]+)\].*?This item is a miscellaneous combat item\."
fields = code
key = mag_items
value = {code}
value_set = inlist

; Example: book of exorcism ... This item may only be used by a mage or an apprentice.
pattern = ".*?\[([A-Z]+)\].*?This item may only be used by a mage or an apprentice\."
fields = code
key = mag_items
value = {code}
value_set = inlist

; Rule 6: Men/Races - "This race" in description
; Example: gnome ... This race may study herb lore ...
pattern = ".*?\[([A-Z]+)\].*?This race"
fields = code
key = men
value = {code}
value_set = inlist

; Rule 7: Mounts - "This is a mount"
; Example: giant turtle ... This is a mount.
pattern = ".*?\[([A-Z]+)\].*?This is a mount\."
fields = code
key = mounts
value = {code}
value_set = inlist

; Rule 8: Shields - "This item provides a physical shield"
; Example: wooden shield ... This item provides a physical shield in battle
pattern = ".*?\[([A-Z]+)\].*?This item provides a physical shield"
fields = code
key = shields
value = {code}
value_set = inlist

; Rule 9: Food/Consumables - "This item can be eaten"
; Example: fish ... This item can be eaten to provide 30 silver
pattern = ".*?\[([A-Z]+)\].*?This item can be eaten"
fields = code
key = normal
value = {code}
value_set = inlist

; Rule 10: Resources - "This item is a trade resource"
; Example: iron ... This item is a trade resource.
pattern = ".*?\[([A-Z]+)\].*?This item is a trade resource\."
fields = code
key = stuff
value = {code}
value_set = inlist

; Also add trade resources to resources section
pattern = ".*?\[([A-Z]+)\].*?This item is a trade resource\."
fields = code
key = resources
value = {code}
value_set = inlist

; Rule 11: Melee weapons - "This is a weapon" AND NOT "ranged"
; Example: battle axe ... This is a cleaving weapon
pattern = ".*?\[([A-Z]+)\].*?This is a (?!ranged).*?weapon"
fields = code
key = weapons
value = {code}
value_set = inlist

; Rule 12: Tools - "This is a tool"
; Example: axe ... This is a tool.
pattern = ".*?\[([A-Z]+)\].*?This is a tool\."
fields = code
key = tools
value = {code}
value_set = inlist

; Rule 15: Transported items - ALL items that have weight, EXCEPT those already categorized
; This rule uses negative lookahead to exclude men, mounts, and magical items
pattern = "^(?!.*(?:This race|This is a mount|This item is a miscellaneous combat item|This item may only be used by a mage)).*?\[([A-Z]+)\].*?weight\s+\d+"
fields = code
key = transported
value = {code}
value_set = inlist

; Rule 16: Also add all weapons and tools to transported (they're already excluded from men/mounts/magical by Rule 15)
; But we need to ensure they're included - this rule catches anything with weight that wasn't caught by specific categories
pattern = ".*?\[([A-Z]+)\].*?weight\s+\d+"
fields = code
key = transported
value = {code}
value_set = inlist

; Rule for Magical skills - any skill description containing "mage" or "magic"
; This covers all magical skills including Foundation, Artifact Lore, combat spells, etc.
pattern = "^([A-Za-z_ ]+?)\s*\[([A-Z]+)\]\s*\d+:.*?(?:mage|magic)"
fields = skill_name,skill_code
key = mag_skills
value = {skill_code}_
value_set = inlist

; Rule for Monsters and FMIs
; Matches items with "This is a monster." or "This is a free-moving-item (FMI)."
pattern = ".*?\[([A-Z]+)\].*?(?:This is a monster|This is a free-moving-item \(FMI\))"
fields = code
key = monsters
value = {code}
value_set = inlist

[WEIGHTS_CAPACITIES]
; Извлечение веса и грузоподъемности из описания предмета
; Пример: sword [SWOR], weight 1, walking capacity 20, riding capacity 20
pattern = ".*?\[([A-Z]+)\].*?weight\s+(\d+).*?(?:walking capacity\s+(\d+))?.*?(?:riding capacity\s+(\d+))?.*?(?:flying capacity\s+(\d+))?.*?(?:swimming capacity\s+(\d+))?"
fields = code,weight,walk_cap,ride_cap,fly_cap,swim_cap
key = {code}
value = {weight},{walk_cap},{ride_cap},{fly_cap},{swim_cap}